# Our changes to the iROSE game data. See README.md in this folder.
#
# Each [[stb]] entry sets one cell of one STB table. The game client applies them when it
# loads its data and the server's game data upload applies them to what it sends, so both
# sides see the same value. Every entry names the wiki page that asks for it, and that page
# shows the new value.
#
# Example (not active):
#
# [[stb]]
# file = "3DDATA/STB/LIST_ZONE.STB"
# row = 22                # the zone's row (its id)
# column = 18             # its PvP state
# value = 0
# note = "No PvP here, wiki/zones/<the zone's page>.md"
