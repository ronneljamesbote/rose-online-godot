[package]
name = "rose-stdb-module"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
spacetimedb = "2.10.2"
log = "0.4"
rand = "0.8.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
glam = "0.24"
rose-game-data = { path = "../crates/rose-game-data" }
rose-data = { path = "../crates/rose-data" }
rose-data-irose = { path = "../crates/rose-data-irose" }
rose-file-readers = { path = "../crates/rose-file-readers" }
rose-game-common = { path = "../crates/rose-game-common" }
rose-game-irose = { path = "../crates/rose-game-irose" }
enum-map = "2.0"
