[package]
name = "rose-gd"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
# The dev client: GM commands (RoseNet.gm_command). The production build leaves it off.
dev = []

[dependencies]
# register-docs: the /// comments of our classes show in the editor (Inspector tooltips, class help).
godot = { version = "0.5.5", features = ["api-4-7", "register-docs"] }
rose-data = { path = "../../crates/rose-data" }
rose-data-irose = { path = "../../crates/rose-data-irose" }
rose-data-export = { path = "../../crates/rose-data-export" }
rose-file-readers = { path = "../../crates/rose-file-readers" }
rose-game-common = { path = "../../crates/rose-game-common" }
rose-game-irose = { path = "../../crates/rose-game-irose" }
rose-quest = { path = "../../crates/rose-quest" }
rose-game-data = { path = "../../crates/rose-game-data" }
rose-game-overrides = { path = "../../crates/rose-game-overrides" }
num-traits = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = "1"
toml = "0.8"
enum-map = { workspace = true }
anyhow = { workspace = true }
glam = { workspace = true }
spacetimedb-sdk = "2.10.2"
