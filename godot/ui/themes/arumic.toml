# Arumic: light lavender glass with periwinkle lines and gold details, the original ROSE
# colours made simpler. This is the default theme.
#
# To make your own theme, copy this file in the themes folder, rename it (for example
# my-theme.toml) and change the values. A file only needs the values it changes when it
# starts with base = "arumic" (or another theme's file name). Reload themes in
# Options > Interface, or restart the game.
#
# Colours: "#rrggbb", "#rrggbbaa" or "rgba(r, g, b, a)" with a from 0 to 1.
# Sizes are pixels at 100% interface size.

name = "Arumic"
description = "Light lavender glass, the classic ROSE colours"
dark = false               # true for dark themes (tells the game how to draw some details)

[font]
family = "Baloo 2"         # Nunito, Baloo 2, Quicksand, or the name of a .ttf/.otf file in this folder
size = 14
weight = 500
bold_weight = 800
title_size = 15
title_upper = false        # titles in capital letters
title_spacing = 0          # extra pixels between title letters

[colors]
text = "#2f3366"
muted = "#7177a8"
accent = "#e9a52a"
title = "#5a61c9"
grip = "rgba(106, 114, 214, 0.5)"
window_button = "#8a90c4"
close = "#d94a63"
key = "#5a61c9"            # key letters on hotbar slots
separator = "rgba(132, 140, 222, 0.3)"
hover = "rgba(106, 114, 214, 0.12)"
selected = "rgba(106, 114, 214, 0.22)"
enemy = "#d83a52"
friendly = "#22954a"
good = "#22954a"
bad = "#d83a52"
rare = "#3a5cd6"
unique = "#d26a0c"
zuly = "#a86a00"
text_outline = "rgba(0, 0, 0, 0)"   # outline under window text (useful on see-through themes)

[panel]
top = "rgba(255, 255, 255, 0.95)"
middle = "rgba(240, 238, 255, 0.90)"
bottom = "rgba(222, 220, 250, 0.90)"
radius = 12
border_width = 1
border_color = "rgba(132, 140, 222, 0.45)"
shadow_color = "rgba(46, 40, 110, 0.32)"
shadow_size = 14
shadow_offset = 6
highlight = "#ffffff"      # thin line along the top edge
blur = 10                  # blur of the world behind windows; 0 = none

[title]
height = 32
top = "rgba(123, 131, 224, 0.20)"
bottom = "rgba(123, 131, 224, 0)"
line = "rgba(132, 140, 222, 0.30)"

[slot]
size = 42
radius = 9
top = "rgba(106, 114, 214, 0.24)"
bottom = "rgba(255, 255, 255, 0.70)"
border_color = "rgba(132, 140, 222, 0.35)"
inner_shadow = "rgba(46, 40, 110, 0.28)"
label = "rgba(90, 97, 201, 0.45)"
key_background = "rgba(255, 255, 255, 0.88)"   # chip behind the hotbar key once the slot is filled (key colour: colors.key)
key_outline = "rgba(255, 255, 255, 0)"
key_outline_size = 0
key_size = 10
count = "#ffffff"             # stack count over item icons
count_outline = "rgba(30, 28, 84, 0.95)"
count_outline_size = 4
count_size = 12
cooldown = "rgba(24, 20, 60, 0.62)"     # dark sweep over a skill while it cools down

[bars]
height = 16
radius = 6
font_size = 11
back_top = "rgba(80, 86, 170, 0.32)"
back_bottom = "rgba(106, 114, 214, 0.12)"
text = "#ffffff"
text_outline = "rgba(40, 40, 100, 0.9)"
hp = "#ee4d78"
hp_lag = "#ffd77a"
mp = "#4e8af0"
stamina = "#52c27a"
xp = "#e9a52a"
cast = "#7b83e0"
sheen = 0.45               # glossy highlight on the bar fill, 0 to 1

[button]
radius = 16
text = "#ffffff"
top = "#a9afff"
middle = "#7b83e0"
bottom = "#5d65c8"
border_color = "rgba(0, 0, 0, 0)"
shadow_color = "rgba(46, 40, 110, 0.35)"
text_outline = "rgba(40, 40, 110, 0.5)"

[button2]
text = "#5a61c9"
top = "#ffffff"
bottom = "rgba(232, 230, 255, 0.9)"
border_color = "rgba(123, 131, 224, 0.6)"

[tab]
style = "pill"             # pill or underline
text_on = "#ffffff"
top = "#a9afff"
bottom = "#6a72d6"
underline = "#e9a52a"

[field]
background = "rgba(255, 255, 255, 0.9)"
border_color = "rgba(132, 140, 222, 0.45)"
text = "#2f3366"

[tooltip]
top = "#ffffff"
bottom = "rgba(238, 236, 255, 0.98)"
border_color = "rgba(132, 140, 222, 0.45)"
text = "#2f3366"

[portrait]
center = "#ffffff"
edge = "rgba(123, 131, 224, 0.45)"
border_color = "#ffffff"
border_width = 2

[level]
top = "#ffd27a"
bottom = "#e09314"
text = "#ffffff"
border_color = "#ffffff"

[menu]
top = "rgba(255, 255, 255, 0.70)"
bottom = "rgba(123, 131, 224, 0.12)"
icon = "#5a61c9"

[tags]                     # name tags over characters
player = "#ffffff"
party = "#8fd8ff"
monster = "#ffd6d6"
npc = "#ddffc0"
outline = "#3b3f86"

[chat]
say = "#2f3366"
party = "#1673b8"
whisper = "#b8288f"
system = "#a86a00"
shout = "#cc4a1c"
outline = "rgba(0, 0, 0, 0)"

[map]
radius = 12
ring_color = "#ffffff"
ring_width = 2
me = "#e9a52a"
label_background = "rgba(246, 245, 255, 0.9)"
