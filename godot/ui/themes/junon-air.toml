# Junon Air: clear frosted white with sky blue and gold.
# See arumic.toml for how to make your own theme.

name = "Junon Air"
description = "Frosted white glass with sky blue"
dark = false

[font]
family = "Quicksand"
size = 14
weight = 600
bold_weight = 700
title_size = 15
title_upper = false
title_spacing = 0

[colors]
text = "#233a57"
muted = "#6d82a0"
accent = "#e0a531"
title = "#233a57"
grip = "rgba(35, 58, 87, 0.25)"
window_button = "#8aa0bd"
close = "#e5486f"
key = "#233a57"
separator = "rgba(35, 58, 87, 0.08)"
hover = "rgba(78, 166, 255, 0.12)"
selected = "rgba(78, 166, 255, 0.22)"
enemy = "#d93a5f"
friendly = "#1c9a64"
good = "#1c9a64"
bad = "#d93a5f"
rare = "#3b63e6"
unique = "#dc7410"
zuly = "#b07b0a"
text_outline = "rgba(0, 0, 0, 0)"

[panel]
top = "rgba(255, 255, 255, 0.88)"
middle = "rgba(240, 247, 255, 0.72)"
bottom = "rgba(222, 236, 252, 0.70)"
radius = 16
border_width = 1
border_color = "rgba(255, 255, 255, 0.85)"
shadow_color = "rgba(30, 60, 110, 0.28)"
shadow_size = 16
shadow_offset = 7
highlight = "#ffffff"
blur = 16

[title]
height = 34
top = "rgba(78, 166, 255, 0.16)"
bottom = "rgba(78, 166, 255, 0)"
line = "rgba(35, 58, 87, 0.08)"

[slot]
size = 42
radius = 12
top = "rgba(35, 58, 87, 0.16)"
bottom = "rgba(255, 255, 255, 0.75)"
border_color = "rgba(255, 255, 255, 0.9)"
inner_shadow = "rgba(30, 60, 110, 0.22)"
label = "rgba(35, 58, 87, 0.35)"
key_background = "rgba(255, 255, 255, 0.88)"
count_outline = "rgba(14, 34, 66, 0.95)"
cooldown = "rgba(10, 26, 52, 0.6)"

[bars]
height = 15
radius = 5
font_size = 10.5
back_top = "rgba(35, 58, 87, 0.22)"
back_bottom = "rgba(35, 58, 87, 0.07)"
text = "#ffffff"
text_outline = "rgba(20, 50, 90, 0.9)"
hp = "#ff6386"
hp_lag = "#ffd98f"
mp = "#4ea6ff"
stamina = "#3cc98e"
xp = "#ffbf3f"
cast = "#4ea6ff"
sheen = 0.45

[button]
radius = 16
text = "#ffffff"
top = "#8fd0ff"
middle = "#4ea6ff"
bottom = "#2f86e4"
border_color = "rgba(0, 0, 0, 0)"
shadow_color = "rgba(30, 90, 170, 0.35)"
text_outline = "rgba(20, 60, 140, 0.45)"

[button2]
text = "#233a57"
top = "#ffffff"
bottom = "rgba(232, 242, 255, 0.9)"
border_color = "rgba(35, 58, 87, 0.15)"

[tab]
style = "pill"
text_on = "#ffffff"
top = "#8fd0ff"
bottom = "#3b95f2"
underline = "#e0a531"

[field]
background = "rgba(255, 255, 255, 0.85)"
border_color = "rgba(35, 58, 87, 0.12)"
text = "#233a57"

[tooltip]
# Tooltips (and menus) use the theme's colours but stand apart from windows and HUD
# panels: Junon Air's sky navy, deeper than its light windows, with a soft drop shadow.
opacity = 0.88             # background, 0 = invisible to 1 = solid; the window opacity setting does not change it
top = "#34587f"
bottom = "#1b2d45"
border_color = "rgba(0, 0, 0, 0)"
shadow_color = "rgba(0, 0, 0, 0.7)"
shadow_size = 12
shadow_offset = 4
radius = 3
text = "#ffffff"

[portrait]
center = "#ffffff"
edge = "rgba(78, 166, 255, 0.35)"
border_color = "#ffffff"
border_width = 2

[level]
top = "#ffd47c"
bottom = "#d9951c"
text = "#ffffff"
border_color = "#ffffff"

[menu]
top = "rgba(255, 255, 255, 0.75)"
bottom = "rgba(255, 255, 255, 0.2)"
icon = "#4f6b8f"

[tags]
player = "#ffffff"
party = "#8fd8ff"
monster = "#ffe2e8"
npc = "#e2ffd6"
outline = "rgba(31, 79, 134, 0.9)"

[chat]
say = "#233a57"
party = "#1e7fd6"
whisper = "#c2409f"
system = "#a5700a"
shout = "#d9622b"
outline = "rgba(0, 0, 0, 0)"

[map]
radius = 16
ring_color = "rgba(255, 255, 255, 0.95)"
ring_width = 3
me = "#4ea6ff"
label_background = "rgba(255, 255, 255, 0.85)"
