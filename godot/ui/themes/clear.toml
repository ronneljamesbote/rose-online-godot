# Clear: almost no panels. Text and bars float over the world; windows get a soft dark
# blur only where needed, with gold and lavender accents.
# See arumic.toml for how to make your own theme.

name = "Clear"
description = "Minimal: soft dark blur, text over the world"
dark = true

[font]
family = "Nunito"
size = 14
weight = 600
bold_weight = 800
title_size = 12
title_upper = true
title_spacing = 1.5

[colors]
text = "#ffffff"
muted = "rgba(255, 255, 255, 0.72)"
accent = "#ffd37a"
title = "#ffd37a"
grip = "rgba(255, 255, 255, 0.35)"
window_button = "rgba(255, 255, 255, 0.6)"
close = "#ffffff"
key = "#ffd37a"
separator = "rgba(255, 255, 255, 0.12)"
hover = "rgba(255, 255, 255, 0.10)"
selected = "rgba(255, 211, 122, 0.18)"
enemy = "#ff9aa8"
friendly = "#9df0b4"
good = "#9df0b4"
bad = "#ff9a9a"
rare = "#9fd0ff"
unique = "#ffb35c"
zuly = "#ffd37a"
text_outline = "rgba(0, 0, 0, 0.55)"

[panel]
top = "rgba(30, 30, 54, 0.40)"
middle = "rgba(10, 10, 24, 0.46)"
bottom = "rgba(6, 6, 16, 0.54)"
radius = 8
border_width = 0
border_color = "rgba(0, 0, 0, 0)"
shadow_color = "rgba(0, 0, 0, 0.4)"
shadow_size = 14
shadow_offset = 5
highlight = "rgba(255, 255, 255, 0.08)"
blur = 14

[title]
height = 30
top = "rgba(255, 211, 122, 0.12)"
bottom = "rgba(255, 211, 122, 0)"
line = "rgba(0, 0, 0, 0)"

[slot]
size = 42
radius = 6
top = "rgba(0, 0, 0, 0.36)"
bottom = "rgba(0, 0, 0, 0.22)"
border_color = "rgba(255, 255, 255, 0.12)"
inner_shadow = "rgba(0, 0, 0, 0.55)"
label = "rgba(255, 255, 255, 0.35)"
key_background = "rgba(0, 0, 0, 0.62)"
count_outline = "rgba(0, 0, 0, 0.95)"
cooldown = "rgba(0, 0, 0, 0.65)"

[bars]
height = 14
radius = 3
font_size = 10.5
back_top = "rgba(0, 0, 0, 0.6)"
back_bottom = "rgba(0, 0, 0, 0.35)"
text = "#ffffff"
text_outline = "rgba(0, 0, 0, 0.95)"
hp = "#ff5f7e"
hp_lag = "#ffd37a"
mp = "#6aa8ff"
stamina = "#ffd37a"
xp = "#c6a6ff"
cast = "#ffd37a"
sheen = 0.4

[button]
radius = 6
text = "#1c1405"
top = "#ffe7b0"
middle = "#ffd37a"
bottom = "#e3a73f"
border_color = "rgba(0, 0, 0, 0)"
shadow_color = "rgba(0, 0, 0, 0.45)"
text_outline = "rgba(0, 0, 0, 0)"

[button2]
text = "#ffffff"
top = "rgba(255, 255, 255, 0.2)"
bottom = "rgba(255, 255, 255, 0.06)"
border_color = "rgba(0, 0, 0, 0)"

[tab]
style = "underline"
text_on = "#ffffff"
top = "rgba(255, 211, 122, 0)"
bottom = "rgba(255, 211, 122, 0.18)"
underline = "#ffd37a"

[field]
background = "rgba(0, 0, 0, 0.35)"
border_color = "rgba(255, 255, 255, 0.14)"
text = "#ffffff"

[tooltip]
# Tooltips (and menus) use the theme's colours but stand apart from windows and HUD
# panels: near black, darker than Clear's see-through panels, with a soft drop shadow.
opacity = 0.88             # background, 0 = invisible to 1 = solid; the window opacity setting does not change it
top = "#1a1a2c"
bottom = "#050509"
border_color = "rgba(0, 0, 0, 0)"
shadow_color = "rgba(0, 0, 0, 0.7)"
shadow_size = 12
shadow_offset = 4
radius = 3
text = "#ffffff"

[portrait]
center = "rgba(255, 255, 255, 0.25)"
edge = "rgba(0, 0, 0, 0.55)"
border_color = "rgba(255, 255, 255, 0.8)"
border_width = 1.5

[level]
top = "#ffe7b0"
bottom = "#e3a73f"
text = "#1c1405"
border_color = "rgba(0, 0, 0, 0)"

[menu]
top = "rgba(0, 0, 0, 0)"
bottom = "rgba(0, 0, 0, 0)"
icon = "#ffffff"

[tags]
player = "#ffffff"
party = "#9fe0ff"
monster = "#ffc2c2"
npc = "#c4f7c8"
outline = "#000000"

[chat]
say = "#ffffff"
party = "#9fe0ff"
whisper = "#ffb3ee"
system = "#ffd37a"
shout = "#ffc08a"
outline = "rgba(0, 0, 0, 0.85)"

[map]
radius = 4
ring_color = "rgba(255, 255, 255, 0.75)"
ring_width = 1.5
me = "#ffd37a"
label_background = "rgba(10, 10, 24, 0.5)"
