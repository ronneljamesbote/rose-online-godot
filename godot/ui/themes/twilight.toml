# Twilight: dark indigo glass, lavender hairlines and gold accents.
# See arumic.toml for how to make your own theme.

name = "Twilight"
description = "Dark indigo glass with gold accents"
dark = true

[font]
family = "Nunito"
size = 14
weight = 500
bold_weight = 800
title_size = 12.5
title_upper = true
title_spacing = 1

[colors]
text = "#ecebff"
muted = "#a29fcc"
accent = "#f2c96b"
title = "#f3f0ff"
grip = "rgba(190, 182, 255, 0.45)"
window_button = "#a29fcc"
close = "#ff9aae"
key = "#f2c96b"
separator = "rgba(190, 182, 255, 0.14)"
hover = "rgba(190, 182, 255, 0.10)"
selected = "rgba(242, 201, 107, 0.16)"
enemy = "#ff9aae"
friendly = "#8fe3a8"
good = "#86e39a"
bad = "#ff8a8a"
rare = "#8fc8ff"
unique = "#ffb35c"
zuly = "#f2c96b"
text_outline = "rgba(0, 0, 0, 0)"

[panel]
top = "rgba(48, 44, 96, 0.84)"
middle = "rgba(20, 19, 44, 0.88)"
bottom = "rgba(14, 13, 32, 0.90)"
radius = 10
border_width = 1
border_color = "rgba(190, 182, 255, 0.20)"
shadow_color = "rgba(5, 4, 20, 0.55)"
shadow_size = 16
shadow_offset = 7
highlight = "rgba(255, 255, 255, 0.12)"
blur = 12

[title]
height = 32
top = "rgba(190, 182, 255, 0.16)"
bottom = "rgba(190, 182, 255, 0)"
line = "rgba(190, 182, 255, 0.14)"

[slot]
size = 42
radius = 7
top = "rgba(0, 0, 0, 0.30)"
bottom = "rgba(255, 255, 255, 0.08)"
border_color = "rgba(190, 182, 255, 0.14)"
inner_shadow = "rgba(0, 0, 0, 0.5)"
label = "rgba(220, 215, 255, 0.35)"
key_background = "rgba(16, 12, 34, 0.78)"
count_outline = "rgba(0, 0, 0, 0.92)"
cooldown = "rgba(0, 0, 0, 0.62)"

[bars]
height = 16
radius = 6
font_size = 11
back_top = "rgba(0, 0, 0, 0.45)"
back_bottom = "rgba(255, 255, 255, 0.07)"
text = "#ffffff"
text_outline = "rgba(0, 0, 0, 0.85)"
hp = "#f0507f"
hp_lag = "rgba(242, 201, 107, 0.85)"
mp = "#5b8dff"
stamina = "#f2c96b"
xp = "#b99bff"
cast = "#f2c96b"
sheen = 0.45

[button]
radius = 7
text = "#241a05"
top = "#ffe7a8"
middle = "#f2c96b"
bottom = "#d9a541"
border_color = "rgba(0, 0, 0, 0)"
shadow_color = "rgba(0, 0, 0, 0.45)"
text_outline = "rgba(0, 0, 0, 0)"

[button2]
text = "#ecebff"
top = "rgba(255, 255, 255, 0.12)"
bottom = "rgba(255, 255, 255, 0.02)"
border_color = "rgba(190, 182, 255, 0.35)"

[tab]
style = "underline"
text_on = "#f3f0ff"
top = "rgba(242, 201, 107, 0)"
bottom = "rgba(242, 201, 107, 0.16)"
underline = "#f2c96b"

[field]
background = "rgba(255, 255, 255, 0.06)"
border_color = "rgba(190, 182, 255, 0.2)"
text = "#ecebff"

[tooltip]
top = "rgba(40, 37, 80, 0.97)"
bottom = "rgba(16, 15, 34, 0.97)"
border_color = "rgba(190, 182, 255, 0.25)"
text = "#ecebff"

[portrait]
center = "rgba(190, 182, 255, 0.3)"
edge = "rgba(10, 9, 26, 0.8)"
border_color = "#f2c96b"
border_width = 1.5

[level]
top = "#ffe7a8"
bottom = "#e0ae4a"
text = "#241a05"
border_color = "rgba(0, 0, 0, 0)"

[menu]
top = "rgba(255, 255, 255, 0.07)"
bottom = "rgba(255, 255, 255, 0)"
icon = "#cfcaf5"

[tags]
player = "#f2f0ff"
party = "#8fd8ff"
monster = "#ffb3b3"
npc = "#a6f0b4"
outline = "#000000"

[chat]
say = "#f0eeff"
party = "#8fdcff"
whisper = "#ffa6ea"
system = "#f2c96b"
shout = "#ffb877"
outline = "rgba(0, 0, 0, 0.6)"

[map]
radius = 8
ring_color = "rgba(242, 201, 107, 0.85)"
ring_width = 2
me = "#f2c96b"
label_background = "rgba(22, 21, 46, 0.8)"
