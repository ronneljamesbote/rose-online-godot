[workspace]
resolver = "2"
members = [
    "crates/rose-data",
    "crates/rose-data-irose",
    "crates/rose-data-export",
    "crates/rose-file-readers",
    "crates/rose-game-common",
    "crates/rose-game-irose",
    "crates/rose-game-data",
    "crates/rose-game-overrides",
    "crates/rose-quest",
    "import",
    "godot/rust",
    "tools/wiki-gen",
]
# The module builds for wasm32 and the bot has its own SpacetimeDB SDK pins, so each keeps its own workspace.
exclude = ["module", "bot"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["James Benton <james.benton2@gmail.com>"]

[workspace.dependencies]
aes = "0.8.1"
anyhow = "1.0"
arrayvec = "0.7"
bitflags = "2.3"
bitvec = { version = "1.0", features = ["serde"] }
bytes = "1.1"
ctr = "0.9.1"
encoding_rs = "0.8"
enum-map = { version = "2.0", features = ["serde"] }
flate2 = "1.0"
glam = { version = "0.24", features = ["serde"] }
log = "0.4"
md5 = "0.7"
memmap = "0.7"
num-derive = "0.4"
num-traits = "0.2"
rand = "0.8"
schemars = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"

[profile.dev.package."*"]
opt-level = 3
